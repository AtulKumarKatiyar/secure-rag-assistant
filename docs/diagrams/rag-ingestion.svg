<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640" role="img" aria-labelledby="title desc">
  <title id="title">RAG Ingestion Flow</title>
  <desc id="desc">Market data ingestion flow into the vector store.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:12}
      .source{fill:#f0fdf4;stroke:#16a34a;stroke-width:2;rx:12}
      .drop{fill:#fef2f2;stroke:#dc2626;stroke-width:2;rx:12}
      .store{fill:#ecfeff;stroke:#0891b2;stroke-width:2;rx:12}
      .line{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .label{font:600 17px Arial,sans-serif;fill:#0f172a}
      .small{font:14px Arial,sans-serif;fill:#334155}
    </style>
  </defs>
  <text x="40" y="42" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">RAG Ingestion Flow</text>

  <rect class="box" x="40" y="90" width="230" height="74"/><text class="label" x="72" y="122">EventBridge schedule</text><text class="small" x="94" y="146">or POST /rag/ingest</text>
  <rect class="box" x="360" y="90" width="210" height="74"/><text class="label" x="398" y="122">DataSource</text><text class="small" x="410" y="146">connectors</text>

  <rect class="source" x="90" y="245" width="250" height="72"/><text class="label" x="121" y="276">DemoMarketData</text><text class="small" x="132" y="300">public market data</text>
  <rect class="source" x="395" y="245" width="250" height="72"/><text class="label" x="429" y="276">ClientDocument</text><text class="small" x="436" y="300">tenant-private reports</text>
  <rect class="source" x="700" y="245" width="280" height="72"/><text class="label" x="742" y="276">PremiumVendor</text><text class="small" x="742" y="300">entitlement-restricted research</text>

  <rect class="box" x="420" y="390" width="210" height="76"/><text class="label" x="470" y="422">DocumentFilter</text><text class="small" x="450" y="446">relevance + access metadata</text>
  <rect class="drop" x="755" y="390" width="190" height="76"/><text class="label" x="798" y="422">Drop</text><text class="small" x="784" y="446">stale/noisy/invalid</text>

  <rect class="box" x="80" y="520" width="180" height="70"/><text class="label" x="112" y="552">Chunker</text><text class="small" x="112" y="574">paragraph chunks</text>
  <rect class="box" x="320" y="520" width="210" height="70"/><text class="label" x="358" y="552">Chunk Mapper</text><text class="small" x="350" y="574">metadata preserved</text>
  <rect class="box" x="590" y="520" width="205" height="70"/><text class="label" x="628" y="552">Bedrock Titan</text><text class="small" x="645" y="574">embeddings</text>
  <rect class="store" x="855" y="520" width="210" height="70"/><text class="label" x="908" y="552">Vector Store</text><text class="small" x="894" y="574">RAG retrieval source</text>

  <path class="line" d="M270 127 H360"/>
  <path class="line" d="M465 164 L215 245"/>
  <path class="line" d="M465 164 L520 245"/>
  <path class="line" d="M465 164 L840 245"/>
  <path class="line" d="M215 317 L525 390"/>
  <path class="line" d="M520 317 V390"/>
  <path class="line" d="M840 317 L525 390"/>
  <path class="line" d="M630 428 H755"/>
  <path class="line" d="M525 466 L170 520"/>
  <path class="line" d="M260 555 H320"/>
  <path class="line" d="M530 555 H590"/>
  <path class="line" d="M795 555 H855"/>
</svg>
