server:
  port: 8080

services:
  token-broker-url: "http://localhost:8082"
  stock-api-url:    "http://localhost:8083"

assistant:
  demo-user: "alice"
  demo-password: "password"
  demo-employee-id: "1001"
  agent-routing:
    default-agent: "equity-agent"
    min-score: 3
    fanout-score-gap: 3
    max-agents: 3

spring:
  ai:
    ollama:
      base-url: "http://localhost:11434"
      chat:
        options:
          model: llama3.2
          temperature: 0.1        # deterministic-ish for tool selection
      embedding:
        options:
          model: nomic-embed-text
