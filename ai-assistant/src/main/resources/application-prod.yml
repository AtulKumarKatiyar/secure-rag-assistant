services:
  token-broker-url: ${TOKEN_BROKER_URL}
  stock-api-url: ${MARKET_API_URL}
  connect-timeout-ms: ${DOWNSTREAM_CONNECT_TIMEOUT_MS:750}
  read-timeout-ms: ${DOWNSTREAM_READ_TIMEOUT_MS:2500}

assistant:
  demo-user: ${ASSISTANT_SERVICE_USER}
  demo-password: ${ASSISTANT_SERVICE_PASSWORD}
  demo-employee-id: ${ASSISTANT_SERVICE_EMPLOYEE_ID}
  rag:
    top-k: ${RAG_TOP_K:5}
    min-score: ${RAG_MIN_SCORE:0.75}
    max-age-hours: ${RAG_MAX_AGE_HOURS:720}
  agent-routing:
    default-agent: ${AGENT_ROUTING_DEFAULT_AGENT:equity-agent}
    min-score: ${AGENT_ROUTING_MIN_SCORE:3}
    fanout-score-gap: ${AGENT_ROUTING_FANOUT_SCORE_GAP:3}
    max-agents: ${AGENT_ROUTING_MAX_AGENTS:3}
  agent-execution:
    core-pool-size: ${AGENT_EXECUTION_CORE_POOL_SIZE:8}
    max-pool-size: ${AGENT_EXECUTION_MAX_POOL_SIZE:32}
    queue-capacity: ${AGENT_EXECUTION_QUEUE_CAPACITY:200}
    timeout-ms: ${AGENT_EXECUTION_TIMEOUT_MS:8000}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Caller tokens are validated against the real issuer; there is no shared-secret
          # fallback in production.
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
  ai:
    model:
      chat: ${AI_MODEL_CHAT:bedrock-converse}
      embedding: ${AI_MODEL_EMBEDDING:bedrock-titan}
    bedrock:
      aws:
        region: ${AWS_REGION:ap-south-1}
        timeout: ${BEDROCK_TIMEOUT:5m}
        connection-timeout: ${BEDROCK_CONNECTION_TIMEOUT:5s}
      converse:
        chat:
          options:
            # Haiku-tier default for supervisor + specialist agents; override per AWS account/model access.
            model: ${BEDROCK_CHAT_MODEL:anthropic.claude-3-haiku-20240307-v1:0}
            temperature: ${CHAT_TEMPERATURE:0.1}
            max-tokens: ${CHAT_MAX_TOKENS:1200}
      titan:
        embedding:
          model: ${BEDROCK_EMBEDDING_MODEL:amazon.titan-embed-text-v2:0}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${CHAT_MODEL:llama3.2}
          temperature: ${CHAT_TEMPERATURE:0.1}
      embedding:
        options:
          model: ${EMBEDDING_MODEL:nomic-embed-text}
